name: Build Android APK (Secure V2Ray VPN)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Debug - Check files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== List root files ==="
          ls -la
          echo "=== Check gradlew ==="
          ls -la gradlew || echo "gradlew NOT FOUND"
          echo "=== Check gradle wrapper ==="
          ls -la gradle/wrapper/ || echo "gradle/wrapper NOT FOUND"
          file gradlew || true
          head -5 gradlew || true

      - name: Fix line endings + Grant permission
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secure-V2Ray-VPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk